
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jaccks Chat</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;background:#e9f0ec;font-family:Arial,sans-serif;color:#20332d}
header{background:#087e70;color:white;padding:18px;display:flex;align-items:center;gap:12px}
.logo{background:white;color:#087e70;border-radius:12px;padding:10px;font-weight:bold;font-size:20px}
header small{display:block;margin-top:4px;color:#d6eee6}
main{max-width:700px;margin:20px auto;background:white;border-radius:16px;overflow:hidden;box-shadow:0 5px 25px #0001}
.heading{padding:18px;border-bottom:1px solid #eee}
.heading h3{margin:0 0 5px}
.heading p{margin:0;color:#888;font-size:12px}
#messages{height:60vh;min-height:300px;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:10px}
.msg{background:#edf5f0;padding:12px;border-radius:12px;max-width:85%;overflow-wrap:anywhere}
.msg.mine{background:#d7f5e4;align-self:flex-end}
.msg b{display:block;color:#087e70;font-size:12px;margin-bottom:5px}
.msg p{margin:0;font-size:14px;white-space:pre-wrap}
form#chatForm{display:flex;padding:12px;gap:8px;border-top:1px solid #eee}
input{flex:1;min-width:0;padding:13px;border:1px solid #ddd;border-radius:10px;font-size:14px}
button{border:0;background:#087e70;color:white;padding:12px 17px;border-radius:10px;font-weight:bold}
#login{position:fixed;inset:0;background:#0009;display:grid;place-items:center;padding:20px}
.loginbox{background:white;padding:25px;border-radius:16px;width:100%;max-width:350px}
.loginbox h2{margin-top:0}
.loginbox input{width:100%;margin:10px 0}
.loginbox button{width:100%}
.hidden{display:none!important}
#status{padding:8px 15px;color:#a33;font-size:12px}
footer{text-align:center;padding:12px;color:#999;font-size:11px}
</style>
</head>
<body>

<header>
<div class="logo">J</div>
<div>
<strong>JACCKS CHAT</strong>
<small>Public Chat Room</small>
</div>
</header>

<main>
<div class="heading">
<h3>👥 Grup Publik</h3>
<p>Semua pengguna bisa ngobrol di sini.</p>
</div>

<div id="status"></div>
<div id="messages">Memuat pesan...</div>

<form id="chatForm">
<input id="message" maxlength="1000" placeholder="Tulis pesan..." autocomplete="off">
<button type="submit">Kirim</button>
</form>
<footer>Jaga kesopanan saat mengobrol.</footer>
</main>

<div id="login">
<div class="loginbox">
<h2>Selamat datang!</h2>
<p>Masukkan nama untuk bergabung.</p>
<input id="username" maxlength="30" placeholder="Nama kamu">
<button id="join">MASUK CHAT</button>
</div>
</div>

<script>
const SUPABASE_URL = "https://ufbaocpklcennumwadxv.supabase.co/rest/v1/";
const SUPABASE_KEY = "sb_publishable_Lnj7J6sIo_9CAOSSvumPbQ_jBoFq7bw";

const db = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let name = localStorage.getItem("jaccks_name") || "";

const login = document.getElementById("login");
const messages = document.getElementById("messages");
const statusBox = document.getElementById("status");
const messageInput = document.getElementById("message");

if(name) login.classList.add("hidden");

document.getElementById("join").onclick = () => {
  const value = document.getElementById("username").value.trim();
  if(!value) return alert("Masukkan nama dulu!");

  name = value.slice(0,30);
  localStorage.setItem("jaccks_name",name);
  login.classList.add("hidden");
};

function addMessage(row) {
  if(document.querySelector('[data-id="'+row.id+'"]')) return;

  const empty = messages.querySelector(".empty");
  if(empty) messages.innerHTML = "";

  const box = document.createElement("div");
  box.className = "msg" + (row.name === name ? " mine" : "");
  box.dataset.id = row.id;

  const author = document.createElement("b");
  author.textContent = row.name;

  const content = document.createElement("p");
  content.textContent = row.content;

  box.append(author,content);
  messages.appendChild(box);
  messages.scrollTop = messages.scrollHeight;
}

async function loadMessages() {
  const {data,error} = await db
    .from("messages")
    .select("id,name,content")
    .order("id",{ascending:true})
    .limit(100);

  if(error) {
    statusBox.textContent = "Gagal memuat: " + error.message;
    return;
  }

  messages.innerHTML = "";

  if(!data.length) {
    messages.innerHTML = '<div class="empty">Belum ada pesan. Sapa grup dulu!</div>';
  } else {
    data.forEach(addMessage);
  }
}

document.getElementById("chatForm").onsubmit = async (e) => {
  e.preventDefault();

  if(!name) {
    login.classList.remove("hidden");
    return;
  }

  const content = messageInput.value.trim();
  if(!content) return;

  const button = e.submitter;
  button.disabled = true;

  const {error} = await db.from("messages").insert({
    name:name,
    content:content
  });

  button.disabled = false;

  if(error) {
    statusBox.textContent = "Gagal mengirim: " + error.message;
  } else {
    messageInput.value = "";
    statusBox.textContent = "";
  }
};

loadMessages();

db.channel("jaccks-public-chat")
.on("postgres_changes",{
  event:"INSERT",
  schema:"public",
  table:"messages"
},payload => {
  addMessage(payload.new);
})
.subscribe(status => {
  if(status === "CHANNEL_ERROR") {
    statusBox.textContent = "Koneksi realtime gagal.";
  }
});
</script>
</body>
</html>
